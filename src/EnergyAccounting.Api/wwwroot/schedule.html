<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розклад меню</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f5ef;
            margin: 0;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            color: #234b30;
            text-align: center;
        }

        h2 {
            color: #234b30;
            margin-top: 0;
        }

        .subtitle {
            color: #68756b;
            text-align: center;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 20px #00000010;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #234b30;
        }

        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cdd8cd;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 14px;
            background: white;
        }

        button {
            width: 100%;
            background: #38754b;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

            button:hover {
                background: #2b603b;
            }

            button:disabled {
                opacity: 0.6;
                cursor: not-allowed;
            }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #e1e8e1;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #e4ece4;
            color: #234b30;
        }

        td.empty {
            color: #a3b0a5;
        }

        #message {
            margin-top: 16px;
            text-align: center;
        }

        .success {
            color: #28743c;
        }

        .error {
            color: #c0392b;
        }

        a {
            color: #38754b;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Розклад меню</h1>

        <p class="subtitle">
            Заплануйте страви на тиждень
        </p>

        <!-- UC-05: додати рецепт у розклад -->
        <div class="card">
            <h2>Додати страву</h2>

            <form id="scheduleForm" novalidate>
                <label for="day">День тижня</label>
                <select id="day"></select>

                <label for="meal">Прийом їжі</label>
                <select id="meal"></select>

                <label for="recipe">Рецепт</label>
                <select id="recipe"></select>

                <button type="submit" id="addButton">Додати</button>
            </form>

            <div id="message" role="status"></div>
        </div>

        <!-- FR-10: перегляд розкладу -->
        <div class="card">
            <h2>Мій тиждень</h2>
            <div id="scheduleTable"></div>
        </div>
    </div>

    <script>
        // Значення (value) збігаються з назвами enum на сервері,
        // підписи (label) — українською для користувача.
        const DAYS = [
            { value: "Monday", label: "Понеділок" },
            { value: "Tuesday", label: "Вівторок" },
            { value: "Wednesday", label: "Середа" },
            { value: "Thursday", label: "Четвер" },
            { value: "Friday", label: "П'ятниця" },
            { value: "Saturday", label: "Субота" },
            { value: "Sunday", label: "Неділя" }
        ];

        const MEALS = [
            { value: "Breakfast", label: "Сніданок" },
            { value: "Lunch", label: "Обід" },
            { value: "Dinner", label: "Вечеря" }
        ];

        const form = document.getElementById("scheduleForm");
        const daySelect = document.getElementById("day");
        const mealSelect = document.getElementById("meal");
        const recipeSelect = document.getElementById("recipe");
        const addButton = document.getElementById("addButton");
        const message = document.getElementById("message");
        const table = document.getElementById("scheduleTable");

        // Не увійшла (401): показуємо повідомлення, форма недоступна.
        function showLoginRequired() {
            showMessage("Спочатку увійдіть у систему.", true);
            addButton.disabled = true;
            table.textContent = "Розклад буде доступний після входу.";
        }

        function showMessage(text, isError) {
            message.textContent = text;
            message.className = isError ? "error" : "success";
        }

        function fillSelect(select, options) {
            for (const item of options) {
                const option = document.createElement("option");
                option.value = item.value;
                option.textContent = item.label;
                select.appendChild(option);
            }
        }

        // Список рецептів для вибору — з довідника (GET /api/recipes).
        async function loadRecipes() {
            recipeSelect.replaceChildren();

            try {
                const response = await fetch("/api/recipes", {
                    method: "GET",
                    credentials: "same-origin"
                });

                if (response.status === 401) {
                    showLoginRequired();
                    return;
                }

                const recipes = await response.json();

                // Передумова UC-05: у довіднику є хоча б один рецепт.
                if (recipes.length === 0) {
                    showMessage(
                        "Довідник порожній. Спочатку створіть рецепт.", true);
                    addButton.disabled = true;
                    return;
                }

                fillSelect(recipeSelect, recipes.map(r => ({
                    value: r.id,
                    label: r.name
                })));

                addButton.disabled = false;
            } catch (error) {
                showMessage("Не вдалося отримати рецепти.", true);
                addButton.disabled = true;
            }
        }

        // FR-10: таблиця 7 днів × 3 прийоми їжі, вільні комірки порожні.
        function renderSchedule(entries) {
            const grid = document.createElement("table");

            const head = document.createElement("tr");
            head.appendChild(document.createElement("th"));

            for (const meal of MEALS) {
                const th = document.createElement("th");
                th.textContent = meal.label;
                head.appendChild(th);
            }

            grid.appendChild(head);

            for (const day of DAYS) {
                const row = document.createElement("tr");

                const dayCell = document.createElement("th");
                dayCell.textContent = day.label;
                row.appendChild(dayCell);

                for (const meal of MEALS) {
                    const cell = document.createElement("td");
                    const entry = entries.find(e =>
                        e.day === day.value && e.meal === meal.value);

                    if (entry) {
                        cell.textContent = entry.recipeName;
                    } else {
                        cell.textContent = "—";
                        cell.className = "empty";
                    }

                    row.appendChild(cell);
                }

                grid.appendChild(row);
            }

            table.replaceChildren(grid);
        }

        async function loadSchedule() {
            try {
                const response = await fetch("/api/schedule", {
                    method: "GET",
                    credentials: "same-origin"
                });

                if (response.status === 401) {
                    showLoginRequired();
                    return;
                }

                renderSchedule(await response.json());
            } catch (error) {
                table.textContent = "Не вдалося отримати розклад.";
            }
        }

        // UC-05: надсилаємо запит на додавання (POST /api/schedule).
        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            addButton.disabled = true;
            showMessage("Додавання...", false);

            try {
                const response = await fetch("/api/schedule", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        day: daySelect.value,
                        meal: mealSelect.value,
                        recipeId: recipeSelect.value
                    })
                });

                if (response.status === 401) {
                    showLoginRequired();
                    return;
                }

                const data = await response.json();

                // Відмова (зокрема 409 — слот зайнятий): показуємо
                // повідомлення сервера, розклад не змінюється.
                if (!response.ok) {
                    showMessage(
                        data.message || "Не вдалося додати запис.", true);
                    return;
                }

                showMessage("Запис додано до розкладу.", false);
                await loadSchedule();
            } catch (error) {
                showMessage("Не вдалося отримати відповідь сервера.", true);
            } finally {
                addButton.disabled = recipeSelect.options.length === 0;
            }
        });

        fillSelect(daySelect, DAYS);
        fillSelect(mealSelect, MEALS);
        loadRecipes();
        loadSchedule();
    </script>
</body>
</html>
